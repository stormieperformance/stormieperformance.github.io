<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>STORMIĒ – Daily</title>
<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f7f7f7;
    color: #111;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    letter-spacing: 4px;
    font-weight: 600;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}

select, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-size: 16px;
}

button {
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    padding: 20px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}
</style>
</head>

<body>

<div class="container">

<h1>STORMIĒ</h1>

<div class="card">
<h3>How do you feel today?</h3>
<select id="fatigue">
<option value="low">Fresh</option>
<option value="medium">Okay</option>
<option value="high">Very tired</option>
</select>

<h3>What did you do yesterday?</h3>
<select id="yesterday">
<option value="rest">Rest</option>
<option value="sport-easy">Sport (easy)</option>
<option value="sport-hard">Sport (hard)</option>
<option value="strength">Strength</option>
</select>

<h3>What is your focus right now?</h3>
<select id="goal">
<option value="hypertrophy">Muscle growth</option>
<option value="strength">Max strength</option>
<option value="power">Explosiveness</option>
<option value="endurance">Muscle endurance</option>
</select>

<button onclick="analyze()">Get today's plan</button>
</div>

<div id="output"></div>

</div>

<script>

function analyze() {

let fatigue = document.getElementById("fatigue").value;
let yesterday = document.getElementById("yesterday").value;
let goal = document.getElementById("goal").value;

let plan = "";
let workout = "";

if (fatigue === "high") {
    plan = "Recovery day.";
    workout = "Mobility 10–15 min. Light movement only.";
}

else if (yesterday === "sport-hard") {
    plan = "Light strength session.";
    workout = "3–4 exercises. 3 sets x 6–10 reps. Keep 2 reps in reserve.";
}

else {
    plan = "Strength day.";

    if (goal === "hypertrophy") {
        workout = "4 sets x 6–10 reps. Stop 1–2 reps before failure.";
    }

    if (goal === "strength") {
        workout = "4 sets x 3–5 reps. Heavy but clean technique.";
    }

    if (goal === "power") {
        workout = "5 sets x 2–3 explosive reps. Full rest between sets.";
    }

    if (goal === "endurance") {
        workout = "3 sets x 12–15 reps. Controlled tempo.";
    }
}

document.getElementById("output").innerHTML = `
<div class="result">
<h2>Today</h2>
<p><strong>${plan}</strong></p>
<p>${workout}</p>
</div>
`;

}

</script>

</body>
</html>
