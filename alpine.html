<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpine Note</title>

  <style>
    :root{
      --text:#0f0f10;
      --muted:rgba(0,0,0,0.58);
      --muted2:rgba(0,0,0,0.42);
      --bg:#fff;
      --intro:cubic-bezier(.16,1,.3,1);
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      overflow:hidden;
    }

    .page{
      min-height:100vh;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 24px;
      position:relative;
    }

    .quote-wrap{
      width:min(860px, 100%);
      text-align:center;
    }

    .quote{
      font-size:32px;
      line-height:1.8;
      letter-spacing:0.02em;
      color:var(--text);
      opacity:0;
      transform:translateY(14px);
      animation:reveal 1.35s var(--intro) forwards;
      user-select:none;
    }

    .quote-mark{
      font-size:1em;
    }

    .attribution{
      margin-top:28px;
      font-size:13px;
      letter-spacing:0.28em;
      text-transform:uppercase;
      color:var(--muted2);
      opacity:0;
      transform:translateY(10px);
      animation:reveal 1.1s var(--intro) forwards;
      animation-delay:.55s;
      user-select:none;
    }

    .back-link{
      position:fixed;
      bottom:26px;
      left:50%;
      transform:translateX(-50%);
      font-size:10px;
      letter-spacing:0.24em;
      text-transform:uppercase;
      color:rgba(0,0,0,0.18);
      text-decoration:none;
      opacity:0;
      animation:fadeOnly 1.2s ease forwards;
      animation-delay:1.2s;
      transition:color .2s ease, opacity .2s ease;
    }

    .back-link:hover{
      color:rgba(0,0,0,0.38);
    }

    @keyframes reveal{
      from{
        opacity:0;
        transform:translateY(14px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes fadeOnly{
      from{ opacity:0; }
      to{ opacity:1; }
    }

    @media (max-width: 700px){
      .page{
        padding:40px 20px;
      }

      .quote{
        font-size:22px;
        line-height:1.75;
      }

      .attribution{
        margin-top:22px;
        font-size:11px;
        letter-spacing:0.22em;
      }
    }

    @media (max-width: 420px){
      .quote{
        font-size:18px;
      }

      .attribution{
        font-size:10px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="quote-wrap" aria-label="Alpine quote">
      <div class="quote">
        <span class="quote-mark">“</span>Through time spent in the mountains, away from the crowds, away from the stopwatch and the grades and all the lists of records, I’ve been slowly able to pick apart what is important to me and discard things that are not.<span class="quote-mark">”</span>
      </div>

      <div class="attribution">
        Marc-André Leclerc
      </div>
    </section>

    <a class="back-link" href="/">Return</a>
  </main>
</body>
</html>
