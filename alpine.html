<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Note</title>

<style>

:root{
  --text:#0f0f10;
  --muted:rgba(0,0,0,0.45);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  height:100%;
}

body{
  background:#fff;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

/* page wrapper */

.page{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}

/* quote */

.quote{
  max-width:28ch;
  font-size:30px;
  line-height:1.72;
  letter-spacing:0.01em;
  font-weight:400;
  color:rgba(0,0,0,0.9);

  opacity:0;
  transform:translateY(40px);

  animation:quoteReveal 2.4s cubic-bezier(.16,1,.3,1) forwards;
}

/* author */

.author{
  margin-top:26px;
  font-size:11px;
  letter-spacing:0.32em;
  text-transform:uppercase;
  color:var(--muted);

  opacity:0;
  transform:translateY(30px);

  animation:quoteReveal 2.2s cubic-bezier(.16,1,.3,1) forwards;
  animation-delay:.9s;
}

/* return link */

.return{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  font-size:10px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:rgba(0,0,0,0.22);
  text-decoration:none;

  opacity:0;

  animation:returnFade 2s ease forwards;
  animation-delay:1.6s;

  transition:color .25s ease;
}

.return:hover{
  color:rgba(0,0,0,0.40);
}

/* animations */

@keyframes quoteReveal{

  0%{
    opacity:0;
    transform:translateY(40px);
  }

  60%{
    opacity:.7;
  }

  100%{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes returnFade{
  from{ opacity:0 }
  to{ opacity:1 }
}

/* mobile */

@media (max-width:700px){

.quote{
  font-size:22px;
  line-height:1.7;
}

.author{
  font-size:10px;
  letter-spacing:.25em;
}

}

</style>
</head>

<body>

<div class="page">

<div>

<div class="quote">
“Through time spent in the mountains, away from the crowds, away from the stopwatch and the grades and all the lists of records, I’ve been slowly able to pick apart what is important to me and discard things that are not.”
</div>

<div class="author">
Marc-André Leclerc
</div>

</div>

</div>

<a class="return" href="/">
Return
</a>

</body>
</html>
