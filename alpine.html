
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpine Note</title>

  <style>
    :root{
      --text:#0f0f10;
      --muted:rgba(0,0,0,0.46);
      --muted2:rgba(0,0,0,0.20);
      --bg:#ffffff;
      --intro:cubic-bezier(.16,1,.3,1);
      --motion:cubic-bezier(.22,1,.36,1);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      height:100%;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      overflow:hidden;
      position:relative;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 22%, rgba(0,0,0,0.022), transparent 30%),
        radial-gradient(circle at 50% 78%, rgba(0,0,0,0.010), transparent 34%);
      z-index:0;
    }

    .page{
      position:relative;
      z-index:1;
      min-height:100vh;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 24px;
    }

    .quote-wrap{
      width:min(920px, 100%);
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .quote{
      max-width:28ch;
      font-size:30px;
      line-height:1.72;
      letter-spacing:0.01em;
      font-weight:400;
      color:rgba(0,0,0,0.88);
      opacity:0;
      transform:translateY(12px);
      filter:blur(3px);
      animation:quoteReveal 2.2s var(--intro) forwards;
      text-wrap:balance;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .attribution{
      margin-top:24px;
      font-size:11px;
      letter-spacing:0.32em;
      text-transform:uppercase;
      color:var(--muted);
      opacity:0;
      transform:translateY(8px);
      filter:blur(2px);
      animation:metaReveal 1.8s var(--intro) forwards;
      animation-delay:.85s;
      user-select:none;
      -webkit-font-smoothing:antialiased;
    }

    .back-link{
      position:fixed;
      bottom:28px;
      left:50%;
      transform:translateX(-50%);
      font-size:10px;
      letter-spacing:0.24em;
      text-transform:uppercase;
      color:var(--muted2);
      text-decoration:none;
      opacity:0;
      animation:fadeOnly 1.4s ease forwards;
      animation-delay:1.5s;
      transition:color .25s var(--motion), opacity .25s var(--motion);
      user-select:none;
    }

    .back-link:hover{
      color:rgba(0,0,0,0.34);
    }

    @keyframes quoteReveal{
      0%{
        opacity:0;
        transform:translateY(12px);
        filter:blur(3px);
      }
      35%{
        opacity:0.10;
      }
      65%{
        opacity:0.45;
        filter:blur(1.2px);
      }
      100%{
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
      }
    }

    @keyframes metaReveal{
      0%{
        opacity:0;
        transform:translateY(8px);
        filter:blur(2px);
      }
      100%{
        opacity:1;
        transform:translateY(0);
        filter:blur(0);
      }
    }

    @keyframes fadeOnly{
      from{ opacity:0; }
      to{ opacity:1; }
    }

    @media (max-width: 900px){
      .quote{
        font-size:26px;
        max-width:30ch;
      }
    }

    @media (max-width: 700px){
      .page{
        padding:40px 20px;
      }

      .quote{
        font-size:21px;
        line-height:1.7;
        max-width:30ch;
      }

      .attribution{
        margin-top:20px;
        font-size:10px;
        letter-spacing:0.24em;
      }
    }

    @media (max-width: 420px){
      .quote{
        font-size:18px;
        line-height:1.66;
      }

      .attribution{
        font-size:9px;
      }

      .back-link{
        font-size:9px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="quote-wrap" aria-label="Alpine quote">
      <div class="quote">
        “Through time spent in the mountains, away from the crowds, away from the stopwatch and the grades and all the lists of records, I’ve been slowly able to pick apart what is important to me and discard things that are not.”
      </div>

      <div class="attribution">
        Marc-André Leclerc
      </div>
    </section>

    <a class="back-link" href="/">Return</a>
  </main>
</body>
</html>
