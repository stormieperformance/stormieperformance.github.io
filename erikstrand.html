<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Erik Strand — Personal Training Stockholm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0a0906;
      --paper: #f5f0e8;
      --gold: #b8924a;
      --gold-dim: rgba(184,146,74,0.15);
      --gold-line: rgba(184,146,74,0.3);
      --white: #ffffff;
      --grey: #6b6560;
      --grey-light: rgba(107,101,96,0.15);
      --rule: rgba(10,9,6,0.12);
      --display: 'Playfair Display', serif;
      --body: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      mix-blend-mode: normal;
    }

    nav::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(10,9,6,0.85) 0%, transparent 100%);
      pointer-events: none;
    }

    .nav-logo {
      position: relative;
      font-family: var(--display);
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
    }

    .nav-links {
      position: relative;
      display: flex;
      gap: 36px;
      align-items: center;
    }

    .nav-links a {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245,240,232,0.55);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--paper); }

    .nav-links .book-btn {
      color: var(--gold);
      border: 1px solid var(--gold-line);
      padding: 8px 20px;
    }

    .nav-links .book-btn:hover {
      background: var(--gold-dim);
      color: var(--gold);
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 700px;
      overflow: hidden;
    }

    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        rgba(10,9,6,0.82) 0%,
        rgba(10,9,6,0.4) 55%,
        rgba(10,9,6,0.6) 100%
      );
    }

    .hero-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 48px 72px;
    }

    .hero-kicker {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
      opacity: 0;
      animation: slideUp 0.9s ease 0.3s forwards;
    }

    .hero-headline {
      font-family: var(--display);
      font-size: clamp(72px, 11vw, 148px);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: -0.02em;
      margin-bottom: 36px;
      opacity: 0;
      animation: slideUp 1s ease 0.45s forwards;
    }

    .hero-headline em {
      font-style: italic;
      color: var(--gold);
    }

    .hero-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      opacity: 0;
      animation: slideUp 0.9s ease 0.65s forwards;
    }

    .hero-sub {
      font-size: 13px;
      font-weight: 300;
      color: rgba(245,240,232,0.6);
      line-height: 1.9;
      max-width: 360px;
    }

    .hero-cta {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--paper);
      text-decoration: none;
      border-bottom: 1px solid var(--gold-line);
      padding-bottom: 6px;
      transition: color 0.2s, border-color 0.2s;
    }

    .hero-cta:hover { color: var(--gold); border-color: var(--gold); }

    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeIn 1s ease 1.2s forwards;
    }

    .hero-scroll span {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245,240,232,0.3);
    }

    .scroll-line {
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      animation: scrollPulse 2s ease-in-out infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.4; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.1); }
    }

    /* ── INTRO STRIP ── */
    .intro-strip {
      display: grid;
      grid-template-columns: 1fr 2px 1fr 2px 1fr;
      border-top: 1px solid rgba(184,146,74,0.2);
      border-bottom: 1px solid rgba(184,146,74,0.2);
    }

    .intro-stat {
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .intro-stat-num {
      font-family: var(--display);
      font-size: 52px;
      font-weight: 400;
      color: var(--gold);
      line-height: 1;
    }

    .intro-stat-label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(245,240,232,0.4);
    }

    .intro-divider {
      background: rgba(184,146,74,0.2);
    }

    /* ── EDITORIAL SECTION ── */
    .editorial {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 80vh;
    }

    .editorial-image {
      position: relative;
      overflow: hidden;
    }

    .editorial-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .editorial-image-caption {
      position: absolute;
      bottom: 28px;
      left: 28px;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245,240,232,0.45);
    }

    .editorial-text {
      padding: 80px 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 1px solid rgba(184,146,74,0.15);
    }

    .section-eyebrow {
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .section-eyebrow::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(184,146,74,0.25);
    }

    .editorial-heading {
      font-family: var(--display);
      font-size: clamp(38px, 4.5vw, 62px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 28px;
    }

    .editorial-heading em { font-style: italic; color: var(--gold); }

    .editorial-body {
      font-size: 14px;
      font-weight: 300;
      color: rgba(245,240,232,0.6);
      line-height: 1.95;
      margin-bottom: 40px;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      transition: gap 0.2s;
    }

    .text-link:hover { gap: 18px; }
    .text-link::after { content: '→'; }

    /* ── SERVICES ── */
    .services {
      padding: 100px 48px;
      border-top: 1px solid rgba(184,146,74,0.15);
    }

    .services-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 64px;
    }

    .services-title {
      font-family: var(--display);
      font-size: clamp(42px, 5vw, 72px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 0.95;
    }

    .services-title em { font-style: italic; color: var(--gold); }

    .services-intro {
      font-size: 13px;
      font-weight: 300;
      color: rgba(245,240,232,0.5);
      max-width: 300px;
      line-height: 1.8;
      text-align: right;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: rgba(184,146,74,0.12);
      border: 1px solid rgba(184,146,74,0.12);
    }

    .service-card {
      background: var(--ink);
      padding: 44px 36px;
      transition: background 0.25s;
      cursor: default;
    }

    .service-card:hover { background: #121008; }

    .service-num {
      font-family: var(--display);
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 0.2em;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .service-name {
      font-family: var(--display);
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 14px;
      line-height: 1.1;
    }

    .service-desc {
      font-size: 13px;
      font-weight: 300;
      color: rgba(245,240,232,0.5);
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .service-price {
      font-family: var(--display);
      font-size: 14px;
      font-style: italic;
      color: var(--gold);
    }

    /* ── TESTIMONIAL ── */
    .testimonial {
      padding: 100px 48px;
      border-top: 1px solid rgba(184,146,74,0.15);
      border-bottom: 1px solid rgba(184,146,74,0.15);
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 48px;
      align-items: start;
    }

    .testimonial-mark {
      font-family: var(--display);
      font-size: 120px;
      color: var(--gold);
      opacity: 0.15;
      line-height: 0.8;
      font-style: italic;
    }

    .testimonial-content { padding-top: 12px; }

    .testimonial-quote {
      font-family: var(--display);
      font-size: clamp(24px, 3vw, 38px);
      font-weight: 400;
      font-style: italic;
      line-height: 1.4;
      letter-spacing: -0.01em;
      color: var(--paper);
      margin-bottom: 32px;
    }

    .testimonial-attr {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* ── CTA ── */
    .cta-block {
      padding: 120px 48px;
      text-align: center;
    }

    .cta-kicker {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .cta-headline {
      font-family: var(--display);
      font-size: clamp(56px, 9vw, 128px);
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 0.9;
      margin-bottom: 48px;
    }

    .cta-headline em { font-style: italic; color: rgba(245,240,232,0.35); }

    .cta-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      background: var(--gold);
      text-decoration: none;
      padding: 16px 40px;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: #d4a85a; }

    .btn-secondary {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold-line);
      text-decoration: none;
      padding: 16px 40px;
      transition: background 0.2s;
    }

    .btn-secondary:hover { background: var(--gold-dim); }

    /* ── FOOTER ── */
    footer {
      padding: 32px 48px;
      border-top: 1px solid rgba(184,146,74,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-brand {
      font-family: var(--display);
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .footer-copy {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(245,240,232,0.2);
    }

    .footer-nav { display: flex; gap: 28px; }
    .footer-nav a {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(245,240,232,0.3);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-nav a:hover { color: var(--gold); }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (max-width: 900px) {
      nav { padding: 20px 24px; }
      .hero-content { padding: 0 24px 60px; }
      .intro-strip { grid-template-columns: 1fr 1fr; }
      .intro-divider:nth-child(2) { display: none; }
      .editorial { grid-template-columns: 1fr; }
      .editorial-image { height: 50vw; min-height: 300px; }
      .editorial-text { padding: 52px 24px; border-left: none; border-top: 1px solid rgba(184,146,74,0.15); }
      .services { padding: 72px 24px; }
      .services-header { flex-direction: column; gap: 20px; }
      .services-intro { text-align: left; max-width: 100%; }
      .services-grid { grid-template-columns: 1fr; }
      .testimonial { padding: 72px 24px; grid-template-columns: 1fr; }
      .testimonial-mark { font-size: 72px; }
      .cta-block { padding: 80px 24px; }
      footer { flex-direction: column; gap: 20px; text-align: center; padding: 32px 24px; }
      .footer-nav { justify-content: center; }
    }
  </style>
</head>
<body>

  </div>
</nav>
