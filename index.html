<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STORMI&#x0112;</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }

    .wrap{
      padding: 24px;
    }

    /* Smooth reveal */
    .logo{
      font-size: 64px;
      letter-spacing: 10px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(10px);
      animation: reveal 1.4s ease forwards;
    }

    .sub{
      margin-top: 14px;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0;
      line-height: 1.6;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1.2s;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 0.55;
      }
    }

  </style>
</head>

<body>
  <div class="wrap">
    <div class="logo">STORMI&#x0112;</div>
    <div class="sub">
      Hybrid Performance<br />
      Launching Soon
    </div>
  </div>
</body>
</html>
