<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STORMI&#x0112;</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }

    .wrap{ padding: 24px; }

    /* Typing effect */
    .logo{
      display: inline-block;
      font-size: 64px;
      letter-spacing: 10px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      border-right: 3px solid #000;
      animation: typing 1.8s steps(7, end) forwards, blink .75s step-end infinite;
    }

    .sub{
      margin-top: 14px;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0;
      line-height: 1.6;
      animation: fadeIn 0.9s ease forwards;
      animation-delay: 2.0s;
    }

    @keyframes typing {
      from { width: 0; }
      to   { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    @keyframes fadeIn {
      to { opacity: 0.55; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="logo">STORMI&#x0112;</div>
    <div class="sub">
      Hybrid Performance<br />
      Launching Soon
    </div>
  </div>
</body>
</html>
